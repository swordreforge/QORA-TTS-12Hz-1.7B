name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            suffix: windows-x86_64
          - os: ubuntu-22.04
            suffix: linux-x86_64
          - os: macos-latest
            suffix: macos-aarch64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Build
        # --bins (not --bin qora-tts): packaging below expects BOTH binaries.
        # A narrowed build command is exactly how "tar: compress_model:
        # Cannot stat" happens with a green build step.
        run: cargo build --release --bins

      - name: Verify artifacts (Unix)
        if: runner.os != 'Windows'
        run: |
          test -x target/release/qora-tts || { echo "MISSING target/release/qora-tts"; exit 1; }
          test -x target/release/compress_model || { echo "MISSING target/release/compress_model"; exit 1; }

      - name: Verify artifacts (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Test-Path target\release\qora-tts.exe)) { throw "MISSING target\release\qora-tts.exe" }
          if (-not (Test-Path target\release\compress_model.exe)) { throw "MISSING target\release\compress_model.exe" }

      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: tar czf qora-tts-${{ matrix.suffix }}.tar.gz -C target/release qora-tts compress_model

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path target\release\qora-tts.exe,target\release\compress_model.exe -DestinationPath qora-tts-${{ matrix.suffix }}.zip

      - uses: actions/upload-artifact@v4
        with:
          name: qora-tts-${{ matrix.suffix }}
          path: |
            *.tar.gz
            *.zip

  release:
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            *.zip
            *.tar.gz
